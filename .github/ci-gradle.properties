# Installed as `gradle.properties` in the Gradle user home by every Gradle job in ci.yml and
# release.yml. Properties there take precedence over the root `gradle.properties`, so these
# lines replace its developer-machine budget and its JDK downloads on CI, and leave every
# other property as it is.
#
# ### Why CI needs its own budget
#
# The jobs run on `ubuntu-latest`, which for a private repository is 2 vCPUs and 8 GB of RAM.
# The root budget allows four parallel workers beside a separate Kotlin compile daemon, and a
# cold `test verifyRoborazziDebug` with it holds about 8.4 GB of JVMs at its peak: the Gradle
# daemon, the Kotlin daemon and up to six Robolectric test JVMs. That is more than the whole
# runner, and four CPU-bound test JVMs on two cores only take turns.
#
# With the lines below the same run peaks at about 5.4 GB: the Gradle daemon and at most three
# test JVMs, measured on a machine pinned to two cores.

# One worker per core. Each `test` task forks one JVM (`maxParallelForks = 1` in the root build
# script), so this is also the number of Compose test JVMs running at once.
org.gradle.workers.max=2

# Compile Kotlin inside the Gradle daemon instead of a second, long-lived JVM. CI builds once
# from a cold checkout, so the separate daemon's warm caches never pay for its own heap, and
# its 1.5 GB is what pushed the build past the runner's memory.
kotlin.compiler.execution.strategy=in-process

# The same heap the root file gives the daemon, which now has to hold the compiler as well. It
# is enough: the daemon's live heap peaked at about 1.3 GB across a full cold test run with
# the compiler inside it, and the headroom is for R8 in the release builds.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# No JDK downloads. The build's toolchain is JDK 17 from Eclipse Adoptium (`titanJdk()` in
# build-logic), and every Gradle job installs exactly that with `setup-java` (`temurin`, 17)
# before Gradle starts, so Gradle runs on it and finds it. Left on, a toolchain request the
# runner cannot meet would fetch a JDK through the foojay resolver in the middle of a build that
# holds the signing secrets; off, it fails at configuration and names the toolchain it wanted.
org.gradle.java.installations.auto-download=false

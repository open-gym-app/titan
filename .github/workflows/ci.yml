name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests run their own code, and Renovate's run updated dependencies' code, so the token
# they get reads the repository and nothing more, whatever the repository default is. No job
# here pushes, so no checkout keeps the token in .git/config either.
permissions:
  contents: read

jobs:
  scripts:
    name: Seed, translations and release gate
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The upstream tarball is ~95 MB and only changes when source.lock is
      # re-pinned, so key the cache on the lock file itself.
      - name: Cache the pinned upstream tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/seed/.cache
          key: seed-source-${{ hashFiles('tools/seed/source.lock') }}

      # The images are compared byte for byte with a fresh encode, so the
      # encoder has to be the exact Pillow they were made with: hash-pinned,
      # wheels only.
      - name: Install the pinned Pillow
        id: seed-deps
        run: make seed-deps

      # Both seed steps need the Pillow above, but not each other, so a failing
      # test does not hide the check's result.
      - name: Test the seed generator
        if: ${{ !cancelled() && steps.seed-deps.outcome == 'success' }}
        run: make seed-test

      # Guards against a hand-edited exercises.sql, a tampered upstream tarball,
      # and any image changed in, dropped from or added to the bundle
      - name: Verify the committed seed matches the pinned source
        if: ${{ !cancelled() && steps.seed-deps.outcome == 'success' }}
        run: make seed-check

      - name: Check every translation against the base strings
        if: ${{ !cancelled() }}
        run: make translations-check

      # The release workflow's gate, against a throwaway repository with a tag on main, an
      # unmerged tag, a branch named like a version and the rest of the ways around it.
      - name: Check the release gate
        if: ${{ !cancelled() }}
        run: make release-gate-check

      # The issue-refs checker prints issue titles anyone can write; this holds it to printing
      # their control characters as text, without a token or the network.
      - name: Test the issue-refs checker
        if: ${{ !cancelled() }}
        run: make issue-refs-test

      # The accessibility pass's device settings, against a fake adb: what a11y-reset puts back.
      - name: Check the accessibility settings script
        if: ${{ !cancelled() }}
        run: make a11y-settings-test

  # Every check that needs the Gradle build, in one job so the debug variant compiles once.
  # Each check step runs under `!cancelled()`, so one failing check does not hide the others'
  # results, just as when they were separate jobs. The debug APK is the exception: it is
  # assembled only when every check passed.
  check:
    name: Lint, tests and debug build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Fit Gradle to the runner
        run: install -D -m 644 .github/ci-gradle.properties "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Run Detekt
        run: ./gradlew detekt --continue --warning-mode fail

      - name: Run unit tests and verify screenshots
        id: tests
        if: ${{ !cancelled() }}
        run: ./gradlew test verifyRoborazziDebug --continue

      - name: Verify :core:domain coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: ./gradlew :core:domain:jacocoTestCoverageVerification

      - name: Upload the :core:domain coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-domain-coverage
          path: core/domain/build/reports/jacoco/test
          retention-days: 3
          if-no-files-found: warn

      # After the tests on purpose: lint analyses the classes the test step already compiled,
      # so it adds its analysis and nothing else.
      - name: Run lint
        if: ${{ !cancelled() }}
        run: ./gradlew lint --continue --warning-mode fail

      # The module dependency graph, asserted against the rules docs/ARCHITECTURE.md
      - name: Verify the module dependency graph
        if: ${{ !cancelled() }}
        run: ./gradlew checkArchitecture checkBuildLogic

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  release-build:
    name: Release build (R8)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # See the step of the same name in the `check` job.
      - name: Fit Gradle to the runner
        run: install -D -m 644 .github/ci-gradle.properties "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - name: Assemble release APK
        run: ./gradlew assembleRelease

name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Seed assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The upstream tarball is ~95 MB and only changes when source.lock is
      # re-pinned, so key the cache on the lock file itself.
      - name: Cache the pinned upstream tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: tools/seed/.cache
          key: seed-source-${{ hashFiles('tools/seed/source.lock') }}

      # Guards against a hand-edited exercises.sql or an image dropped from the
      # bundle: both would ship a catalogue that no longer matches the pinned
      # upstream commit. Compares the SQL byte for byte and the image *names*
      # only, since WebP output varies across Pillow versions.
      - name: Verify the committed seed matches the pinned source
        run: make seed-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run Detekt
        run: ./gradlew detekt --continue

      - name: Run lint
        run: ./gradlew lint --continue

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Compose behaviour tests and screenshot tests are both ordinary JVM unit tests under
      # Robolectric, so this one step covers them and no emulator is needed. Naming
      # `verifyRoborazziDebug` in the same invocation as `test` puts the debug unit-test task
      # into screenshot-verification mode rather than running it a second time — asking for
      # them in two invocations would run every Compose test twice.
      - name: Run unit tests and verify screenshots
        run: ./gradlew test verifyRoborazziDebug --continue

      # The diff images this produces are deliberately *not* uploaded. This is a private
      # repository on a free-tier plan, where artifact storage is the scarce resource, and a
      # screenshot diff is reproducible on any machine: the failure names the reference file,
      # and `make screenshots-verify` regenerates the same `*_compare.png` locally. See
      # CONTRIBUTING.md.

      # :core:domain is pure business logic with no Android framework escape hatches,
      # so it carries a hard coverage floor (see core/domain/build.gradle.kts). The
      # task generates the report and then fails the job below the floor.
      - name: Verify :core:domain coverage
        run: ./gradlew :core:domain:jacocoTestCoverageVerification

      # Every run, kept for three days. A failure is the one time anybody opens this report —
      # to see which lines went unexercised — but uploading unconditionally keeps the step
      # off the critical path of diagnosing a red build. At ~1.7 MB per run this is the
      # largest standing claim on a free-tier private repository's artifact storage, so the
      # short retention, not the condition, is what keeps it bounded.
      #
      # A missing report only warns: the tests are finalized by the report task, so a *test*
      # failure still leaves one behind, and the case where none exists is a compile failure —
      # already reported above, and not worth a second red step that says nothing about the
      # cause.
      - name: Upload the :core:domain coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-domain-coverage
          path: core/domain/build/reports/jacoco/test
          retention-days: 3
          if-no-files-found: warn

  build:
    name: Build (debug APK)
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

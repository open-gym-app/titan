name: Release

# The release pipeline (#209). It runs once `ci.yml` has passed on a push, never beside it, so
# nothing reaches a store that did not pass lint, the unit tests and the screenshot checks:
#
# - on `main`, it cuts a release candidate — the next patch after the last release, with the
#   next free `-rc.N` — tags it, and publishes it to Play's internal track and as a GitHub
#   pre-release;
# - on a `v<MAJOR>.<MINOR>.<PATCH>` tag, it publishes that release to Play's production track
#   and as a GitHub Release.
#
# Neither waits for a person: pushing to `main` is what reaches the testers, and pushing a
# release tag is what reaches every user. The whole flow, and what to do when a step fails
# after the tag exists, is written up in release/RELEASE.md.
#
# Three jobs. `plan` decides what this run releases and tags a candidate; `build` needs no
# secret and, for a release, proves the tag builds the same bytes twice; `release` runs in
# the `release` environment and is the only job that sees a secret or uploads anywhere.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A rehearsal. Builds and signs everything for `version` from the dispatched branch and
  # uploads nowhere, so a first-time releaser can watch the whole pipeline without a tag to
  # clean up afterwards. `dry_run` off is the one way to release an existing tag again with a
  # *fixed workflow file*: "Re-run failed jobs" replays `release.yml` as it was when the run
  # started, so a bug in this file cannot be re-run past. The sources are still checked out at
  # the tag, never at the dispatched branch.
  workflow_dispatch:
    inputs:
      version:
        description: "The version, without the v — 1.2.3 or 1.2.3-rc.1"
        required: true
        type: string
      dry_run:
        description: "Build and sign everything, upload nothing"
        type: boolean
        default: true

# One run per version at a time, and every candidate in one queue (`release-main`), so two
# pushes to `main` cannot both pick `rc.3`. Never cancelled: a run interrupted between the
# GitHub Release and the Play upload would leave the two channels disagreeing about what
# shipped, and the tag already exists for both.
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # `event == 'push'` is what keeps a pull request's CI run — a fork's included — from ever
    # starting this workflow, and so from reaching the `release` environment. For a tag push,
    # `head_branch` is the tag's name; anything that is neither `main` nor a `v` tag is a
    # branch CI ran on and has nothing to release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v')))
    # See ci.yml for CI_RUNNER: the org-level switch between the homelab scale set and
    # GitHub-hosted runners.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      # The candidate's tag. Pushed with GITHUB_TOKEN, so it starts no workflow of its own.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      candidate: ${{ steps.plan.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Every tag, to find the last release and the last candidate's number.
          fetch-depth: 0

      # `version` is what `-PreleaseVersion=` gets, without the `v`; Gradle's parser validates
      # it in the next job, so a malformed tag fails there before anything is signed. `ref`
      # is what every later job checks out: the tag, so a run builds what it names.
      - name: Decide what this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            # A rehearsal builds whatever was dispatched; a real release from a dispatch
            # builds the tag it names, never the branch it was dispatched from.
            if [[ "$DRY_RUN" == "true" ]]; then ref="$GITHUB_SHA"; else ref="refs/tags/v$version"; fi
          elif [[ "$HEAD_BRANCH" == "main" ]]; then
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [[ -z "$last" ]]; then
              next=1.0.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              next="$major.$minor.$((patch + 1))"
            fi
            n=$(git tag --list "v$next-rc.*" | sed "s/^v$next-rc\.//" | sort -n | tail -n 1)
            version="$next-rc.$(( ${n:-0} + 1 ))"
            ref="refs/tags/v$version"
          else
            version="${HEAD_BRANCH#v}"
            ref="refs/tags/$HEAD_BRANCH"
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "candidate=$([[ "$EVENT" == "workflow_run" && "$HEAD_BRANCH" == "main" ]] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

      # Before anything is built, so two candidates can never be given the same number: a
      # build that fails afterwards burns its number, which is the cheap direction to be wrong
      # in. Annotated, like a release tag, so `git describe` treats the two alike.
      - name: Tag the candidate
        if: steps.plan.outputs.candidate == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

  build:
    name: Reproducible build
    needs: [plan]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # `-PreleaseVersion=`: the tag without its `v` (build-logic's `ReleaseVersion`).
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_code: ${{ steps.version.outputs.release_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      unsigned_apk_sha256: ${{ steps.first.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The one place the tag is turned into numbers. `printReleaseVersion` runs the same
      # parser `assembleRelease` does, so what the GitHub Release is named, which changelog
      # is read and whether Play is skipped all come from the value the APK carries.
      - name: Resolve the version from the tag
        id: version
        run: |
          ./gradlew -q :app:printReleaseVersion -PreleaseVersion="${RELEASE_VERSION#v}" \
            | grep -E '^(version|version_code|release_code|prerelease)=' | tee -a "$GITHUB_OUTPUT"
          test "$(grep -c . "$GITHUB_OUTPUT")" -ge 4

      # Play's "What's new" has a 500-character limit per locale and GPP would only find out at
      # upload time, after the build was spent. Same task the bundle step runs; here it runs
      # first so a missing or overlong changelog is the first line of the first job's log.
      # Missing is only an error for a release: a candidate goes up with whatever exists.
      - name: Check the changelog
        run: ./gradlew :app:syncPlayReleaseNotes -PreleaseVersion="${{ steps.version.outputs.version }}"

      # Two builds of the unsigned APK, from a clean tree and without the build cache, have
      # to produce the same bytes. This is what F-Droid's verifier (#210) does on its own
      # server against the signed APK we publish: if the two runs here differ, the difference
      # is a timestamp, a path or a hash-order dependency somewhere in the build, and it is
      # this job's business to find it before a release carries it. No keystore in this job
      # on purpose — the unsigned APK is the artifact whose bytes are being compared.
      #
      # A candidate builds once and skips the comparison: it is cut on every push to `main`,
      # F-Droid never builds one, and the release tag that follows is checked before it ships.
      - name: Build the unsigned release APK (first run)
        id: first
        run: |
          ./gradlew :app:assembleRelease -PreleaseVersion="${{ steps.version.outputs.version }}" --no-build-cache
          echo "sha256=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      # A fresh daemon as well as a clean tree: nothing the first run left in memory — R8's
      # caches, the Kotlin compiler's, a class loaded once — is allowed to feed the second.
      - name: Build the unsigned release APK (second run, clean)
        id: second
        if: needs.plan.outputs.candidate != 'true'
        run: |
          ./gradlew clean
          ./gradlew --stop
          ./gradlew :app:assembleRelease -PreleaseVersion="${{ steps.version.outputs.version }}" --no-build-cache
          echo "sha256=$(sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Assert the two builds are byte-identical
        if: needs.plan.outputs.candidate != 'true'
        run: |
          if [ "${{ steps.first.outputs.sha256 }}" != "${{ steps.second.outputs.sha256 }}" ]; then
            echo "::error::The release APK is not reproducible: ${{ steps.first.outputs.sha256 }} != ${{ steps.second.outputs.sha256 }}"
            exit 1
          fi
          echo "Reproducible: ${{ steps.first.outputs.sha256 }}"

      # What a verifier needs to rebuild this exact APK, and what the GitHub Release carries
      # next to it. Gradle and AGP come from the files that pin them so the record cannot
      # drift from the build that was just run; the JDK is whatever setup-java resolved.
      - name: Record the toolchain
        run: |
          {
            echo "tag=v${{ steps.version.outputs.version }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "versionName=${{ steps.version.outputs.version }}"
            echo "versionCode=${{ steps.version.outputs.version_code }}"
            echo "unsignedApkSha256=${{ steps.first.outputs.sha256 }}"
            echo "jdk=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(sed -n 's|.*/gradle-\(.*\)-bin\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)"
            echo "agp=$(sed -n 's/^agp = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
            echo "kotlin=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          } > build-info.txt
          { echo '```'; cat build-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the toolchain record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info
          path: build-info.txt
          retention-days: 90

  release:
    name: Sign and publish
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [plan, build]
    # Every secret below lives on this environment and nowhere else (#44), so a fork's PR
    # cannot reach them. It has no required reviewers on purpose: one would hold every push to
    # `main` until someone approved it, and the point is that nobody has to.
    environment: release
    permissions:
      # The GitHub Release and its assets. Nothing else in this job writes to the repository.
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      # The code the changelog is filed under: the release's own, for a candidate too.
      RELEASE_CODE: ${{ needs.build.outputs.release_code }}
      # `true` for a `-rc.N` tag: a GitHub pre-release, and Play's internal track.
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      # A rehearsal signs and bundles exactly as a release does — that is what it rehearses —
      # and stops at each upload step. On a tag push `inputs` is empty and this is `false`.
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The upload keystore, base64 in a secret, decoded outside the checkout so no Gradle
      # task can ever package it. `KEYSTORE_PATH` is what app/build.gradle.kts reads; it
      # is the same four names keystore.properties.example documents for a local build.
      - name: Install the upload keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # The AAB for Play and the APK for GitHub and F-Droid, from one Gradle invocation so
      # they share a configuration, a commit and a signing key. R8's `mapping.txt` comes out
      # beside them; AGP also packs it into the AAB, which is how Play gets it.
      - name: Build the signed release bundle and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease -PreleaseVersion="$VERSION"

      # A signed APK is the unsigned one plus a signature block; `apksigner verify` fails on
      # an APK that has none (the signing config silently does not attach when the keystore is
      # missing — app/build.gradle.kts) and prints the certificate's fingerprint, which is what
      # a reviewer holds against the upload certificate recorded in release/RELEASE.md.
      - name: Verify the signature and name the artifacts
        run: |
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/titan-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/titan-$VERSION.aab"
          # 68 MB of text that gzips to under 5; every copy below is one someone downloads.
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "dist/mapping-$VERSION.txt.gz"
          # A release always has its changelog (the build job checked); a candidate usually
          # has none yet, and says what it was built from instead.
          changelog="fastlane/metadata/android/en-US/changelogs/$RELEASE_CODE.txt"
          if [ -f "$changelog" ]; then
            cp "$changelog" "dist/changelog-$VERSION.txt"
          else
            echo "Release candidate built from $(git rev-parse --short HEAD)." > "dist/changelog-$VERSION.txt"
          fi
          (cd dist && sha256sum "titan-$VERSION.apk" > "titan-$VERSION.apk.sha256")
          cat "dist/titan-$VERSION.apk.sha256"

      - name: Download the toolchain record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-info
          path: dist

      # Play deobfuscates crash reports with this for as long as the version is installed
      # anywhere, and the Console only holds the copy inside the AAB. The GitHub Release below
      # carries it for good; this artifact is the copy that exists for a rehearsal, which has
      # no release at all.
      - name: Archive the R8 mapping file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ env.VERSION }}
          path: dist/mapping-${{ env.VERSION }}.txt.gz
          retention-days: 90

      # None today: nothing in the release runtime classpath ships an `.so`. The step exists
      # so that the first dependency that does is uploaded rather than silently shipped
      # without them — `ndk.debugSymbolLevel` in app/build.gradle.kts is what makes AGP
      # produce this zip the day there is something to put in it.
      - name: Archive the native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-debug-symbols-${{ env.VERSION }}
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: ignore
          retention-days: 90

      # The very first upload of an app cannot go through the API — Play only binds a package
      # name to an app from the Console (release/RELEASE.md) — and a rehearsal has nowhere
      # else to leave it. Fourteen days: the file exists to be downloaded once, by
      # someone who may not be watching the run.
      - name: Archive the signed bundle and APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: titan-${{ env.VERSION }}
          path: |
            dist/titan-${{ env.VERSION }}.aab
            dist/titan-${{ env.VERSION }}.apk
            dist/titan-${{ env.VERSION }}.apk.sha256
          retention-days: 14

      # GitHub first, Play second, because of what a re-run has to be able to do: this step
      # updates a release that already exists, so a run that failed at the Play step can be
      # re-run from here without a second `v1.2.3` — whereas Play refuses a `versionCode` it has
      # already seen, so a Play upload that went through cannot sit in front of a retried step.
      #
      # The body is the en-US changelog, so the three channels tell the same story from the
      # same file. A candidate is a pre-release and never becomes "latest"; a release does.
      - name: Create the GitHub Release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: dist/changelog-${{ env.VERSION }}.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/titan-${{ env.VERSION }}.apk
            dist/titan-${{ env.VERSION }}.apk.sha256
            dist/changelog-${{ env.VERSION }}.txt
            dist/mapping-${{ env.VERSION }}.txt.gz
            dist/build-info.txt

      - name: Skip the GitHub Release
        if: env.DRY_RUN == 'true'
        run: echo "Dry run — no GitHub Release for v$VERSION. The signed APK is in the titan-$VERSION artifact for fourteen days."

      # A candidate to the internal track, a release to production, both published rather than
      # drafted (`releaseStatus` in app/build.gradle.kts): live for the track's users once
      # Play's review passes, with nobody in the Console. GPP reads the credentials from this
      # variable and needs no file; `publishReleaseBundle` finds the AAB the build step
      # already produced and the changelogs `syncPlayReleaseNotes` copied into its layout —
      # there is no second build. The keystore variables are here because the bundle task is
      # in the graph again and the signing config attaches at configuration.
      - name: Publish the bundle to Play
        if: env.DRY_RUN == 'false'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRACK: ${{ env.PRERELEASE == 'true' && 'internal' || 'production' }}
        run: ./gradlew :app:publishReleaseBundle -PreleaseVersion="$VERSION" --track "$TRACK"

      - name: Skip Play
        if: env.DRY_RUN == 'true'
        run: echo "Dry run — not uploading v$VERSION to Play."

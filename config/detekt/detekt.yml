# Detekt configuration for open-gym
# Suppression policy: any accepted violation committed to detekt-baseline.xml
# must have an inline comment with the rationale at the suppression site.
#
# Schema is detekt 2.x. Three things moved when this migrated off 1.23:
#   - the `build:` block is gone. `maxIssues: 0` was the whole of it, and 2.x has no
#     tolerance dial at all: any finding fails the task, which is what this asked for.
#   - `formatting:` is `ktlint:`, and its `android: true` is now a `code_style` value.
#   - the `threshold*` keys grew names that say what they count.

config:
  validation: true
  warningsAsErrors: false

complexity:
  # A God class is a production-code problem. In a test class, length is coverage:
  # `TemplateEditorViewModelTest` trips this at 875 lines while the 2 599-line
  # `ActiveSessionViewModelTest` does not, which is the tell that what the rule measures
  # here is how thoroughly a ViewModel was tested, not whether the class does too much.
  # Splitting one to satisfy a line count would scatter a single subject across files.
  LargeClass:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    allowedLines: 60
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 20

# Was `formatting:` before detekt 2.x, and backed by `detekt-formatting`; the artifact is
# now `detekt-rules-ktlint-wrapper` (see gradle/libs.versions.toml).
ktlint:
  active: true
  # Replaces 1.23's `android: true`, which is now one of ktlint's named code styles rather
  # than a flag. Deliberately *not* 'android_studio', despite this being an Android app:
  # that style bans trailing commas and wraps at 100 columns, which this codebase does the
  # opposite of on both counts — switching to it reported 3 460 trailing-comma violations
  # and 2 254 wrapping ones, none of them a defect. 'intellij_idea' is the style this code
  # was already written in; `MaximumLineLength` below sets the column limit explicitly.
  code_style: 'intellij_idea'
  # On, so that `./gradlew detekt --auto-correct` actually rewrites rather than only
  # reporting. Every ktlint rule below is correctable, and a contributor who runs detekt
  # before pushing should get the fix rather than a list of column numbers. The task still
  # only *reports* unless `--auto-correct` is passed, so CI (`./gradlew detekt --continue`)
  # is unaffected and never rewrites a checkout.
  autoCorrect: true
  MaximumLineLength:
    maxLineLength: 140
  ImportOrdering:
    layout: '*,java.**,javax.**,kotlin.**,^'
  Indentation:
    indentSize: 4

  # A parameter list of two or more is one parameter per line, always.
  #
  # Both rules ship with this effectively disabled — `FunctionSignature` defaults to
  # Int.MAX_VALUE and `ClassSignature` to 'unset' — which means "collapse onto one line
  # whenever it fits inside maxLineLength". At the 140 this project sets, that turns a
  # three-parameter signature into a 120-character line, and the diff of a parameter being
  # added or retyped stops being one line and becomes the whole signature.
  #
  # 2 rather than 3: a two-parameter signature is where collapsing starts costing a
  # reviewer something, and a rule that applies at three but not two is a rule nobody can
  # predict. One parameter still stays inline, which is the case where wrapping is noise.
  FunctionSignature:
    forceMultilineWhenParameterCountGreaterOrEqualThan: 2
    # The other half of the same complaint. On 'default' a multi-line expression body is
    # hoisted onto the signature line whenever its first line fits, so
    # `fun f(): T = if (cond) {` opens on the declaration and closes at column 0 — the
    # brace no longer lines up with anything that opened it. 'multiline' keeps a body that
    # spans lines on its own line under the `=`, which is how this codebase already reads.
    functionBodyExpressionWrapping: 'multiline'
  ClassSignature:
    # Quoted because this rule types the option as a String (its default is 'unset'),
    # unlike FunctionSignature above, which takes an Int. Passing 2 unquoted fails the
    # run at "is not of required type `kotlin.String`".
    forceMultilineWhenParameterCountGreaterOrEqualThan: '2'

naming:
  FunctionNaming:
    # Allow PascalCase for @Composable functions per Compose conventions
    ignoreAnnotated:
      - 'Composable'
  InvalidPackageDeclaration:
    rootPackage: 'com.opengym'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  ForbiddenComment:
    active: false
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreConstantDeclaration: true
    ignoreEnums: true
    ignoreAnnotation: true
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    max: 3
  WildcardImport:
    excludeImports:
      - 'java.util.*'
      - 'kotlinx.android.synthetic.*'

// Types the Compose compiler cannot see the stability of, and that this project promises are
// stable anyway. Read by every module that applies `titan.android.compose`, and by `:app`,
// through `composeCompiler { stabilityConfigurationFiles }`.
//
// ### What "stable" buys
//
// A composable whose parameters are all stable skips when they are equal. One with an unstable
// parameter is compared by *instance* instead (strong skipping), so it recomposes whenever the
// layer above it rebuilds an equal-but-new object — which a ViewModel mapping several flows
// together does on every emission from any of them. That is exactly the "a list item recomposes
// more than once per data change" #42 asks not to happen.
//
// ### Each entry is a promise, not a hint
//
// The compiler takes these at face value: an entry here that turns out to be mutable is a UI
// that stops updating, silently, and only for the field that changed. Add one only for a type
// whose instances are genuinely never mutated after construction.

// ─── Kotlin's read-only collection interfaces ────────────────────────────────────────────────
//
// `List`, `Set` and `Map` are interfaces, so the compiler must assume an implementation that
// mutates. Nothing in this codebase hands a live collection to composition: every list on a
// screen comes out of a `@Immutable` ui-state built by a ViewModel, and is replaced rather than
// edited. Equality on a collection short-circuits on identity, so this costs nothing in the
// common case and skips a whole subtree in the case it was added for.
kotlin.collections.Collection
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// ─── The domain layer ────────────────────────────────────────────────────────────────────────
//
// `:core:domain` is a plain Kotlin JVM library — no Android dependencies, and no Compose one
// either, which is the whole point of it. So its models cannot carry `@Immutable`, and the
// compiler, seeing them from another module with no stability metadata, assumes the worst about
// every one of them: `Exercise`, `PersonalRecord`, `ExerciseProgression`, `RestTimerState` and
// the rest all arrived at a `@Composable` marked unstable.
//
// Declaring them here rather than adding `androidx.compose.runtime:runtime-annotation` to
// `:core:domain` keeps the stable centre dependency-free — see docs/ARCHITECTURE.md, which is
// the document this line is holding up.
//
// The promise holds by construction: the layer is data classes and value objects over `val`s,
// and `:core:ui` takes them directly precisely because they behave as values.
com.titan.core.domain.**

// ─── java.time ───────────────────────────────────────────────────────────────────────────────
//
// Immutable by specification since Java 8. The compiler has no way to know that.
java.time.**

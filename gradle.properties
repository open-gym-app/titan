android.useAndroidX=true

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Caps the worker lease pool, and with it how many test JVMs the build runs at once.
#
# Left unset this follows the CPU count, which on a 16-core developer machine means
# `parallel=true` starts a `testDebugUnitTest` for eight modules at a time. Each one is a
# Robolectric fork holding a full Android runtime — about 700 MB resident — so the test
# JVMs alone reach ~5.7 GB, on top of this daemon and the Kotlin one. That was enough to
# take a 16 GB machine into a global OOM, and the kernel picked the fattest process in
# sight: this daemon at its old -Xmx4g.
#
# Four is the count that fits a 16 GB machine alongside an IDE. CI runners are not the
# constraint here — they run one job on a clean box — but they are not hurt by it either:
# the standard GitHub runner has 4 cores.
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Resolve the path a hand-written `captureRoboImage("Foo.png")` passes against Roborazzi's
# configured output directory (`src/test/screenshots`, set in AndroidComposeConventionPlugin)
# rather than the process working directory, which is the module root. Without this a
# hand-written capture drops its reference image at the top of the module while the generated
# `@Preview` captures land in `src/test/screenshots`, and only one of the two is ever compared.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

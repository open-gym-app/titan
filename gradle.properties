android.useAndroidX=true

# ### Memory: the whole build has to fit in a laptop, not just each piece of it
#
# These numbers are a budget, not a preference. A full `test` run holds three kinds of JVM at
# once — the Gradle daemon, the Kotlin compile daemon, and one forked test JVM per module task
# running in parallel — and every one of them defaults to a share of the host's RAM. Left alone
# on a 16-core machine that is a daemon plus a compiler plus sixteen Robolectric JVMs, which is
# how this build got killed by the kernel rather than failing with an OutOfMemoryError: the
# processes are individually within their heaps and collectively past the machine.
#
# The daemon holds AGP's model, the Kotlin compiler's caches and the configuration cache, so it
# is the one that keeps 3g. Metaspace is capped for the same reason it is capped on the test
# JVMs below (see the root build script): class metadata is *native* memory and does not count
# against -Xmx, so an uncapped daemon grows past whatever heap it was given.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Without this the Kotlin daemon inherits `org.gradle.jvmargs` wholesale and asks for a second
# 3g heap beside the one the Gradle daemon already holds. It compiles one module at a time and
# 1500m is comfortably above what the largest of them needs.
kotlin.daemon.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m

org.gradle.parallel=true

# The multiplier. `org.gradle.parallel` alone lets Gradle run as many module tasks at once as
# there are cores, and each `test` task among them forks a JVM — so the peak is set by this
# number, not by any single task's own limits. Four keeps a 16-core machine busy through a
# build whose module graph is not sixteen wide anyway, and bounds the worst case to four test
# JVMs (see `maxHeapSize`/`MaxMetaspaceSize` in build.gradle.kts) beside the two daemons above.
org.gradle.workers.max=4

org.gradle.caching=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Resolve the path a hand-written `captureRoboImage("Foo.png")` passes against Roborazzi's
# configured output directory (`src/test/screenshots`, set in AndroidComposeConventionPlugin)
# rather than the process working directory, which is the module root. Without this a
# hand-written capture drops its reference image at the top of the module while the generated
# `@Preview` captures land in `src/test/screenshots`, and only one of the two is ever compared.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

[versions]
agp = "9.3.2"
kotlin = "2.3.20"
ksp = "2.3.9"
coreKtx = "1.16.0"
lifecycle = "2.11.0"
# Compiled against the Android 37 APIs, as is lifecycle 2.11.0 above — both need
# `AndroidSdk.COMPILE` (and `:app`'s `compileSdk`) at 37 to be consumable at all.
androidxHilt = "1.4.0"
activityCompose = "1.12.3"
composeBom = "2026.05.00"
# 2.8+ is the floor for type-safe `composable<Route>` destinations; see docs/ARCHITECTURE.md.
navigation = "2.9.8"
# Coil and Hilt move together, and the pairing is load-bearing rather than tidiness. Coil
# 3.5.0 is compiled with Kotlin 2.4; Hilt bundles its own kotlin-metadata-jvm, and 2.59.2's
# read at most metadata 2.3.0 — so that Coil against that Hilt failed
# `:app:hiltJavaCompileDebug` on the *transitive* Coil classes, with an error naming neither
# library nor this file. Hilt 2.60.1 reads the newer metadata, which is what unblocked the
# 3.4.0 → 3.5.0 bump here. Keep bumping the two together, and run
# `./gradlew :app:assembleDebug` after — it is the task that fails, and the only one that does.
# renovate.json groups them into one PR for this reason.
coil = "3.5.0"
hilt = "2.60.1"
room = "2.8.4"
# Preferences DataStore, for the user settings store. 1.3.x is alpha-only; the
# `androidx.datastore.preferences.core` API this uses has not moved since 1.1.
datastore = "1.2.1"
# WorkManager, for the weekly auto-backup (#181). Deferrable, constraint-gated background
# work only: a backup does not care whether it runs at 03:00 or at 09:00 on Sunday, it cares
# that it eventually runs and survives a reboot. The reminders of #39 are the opposite call
# for the opposite reason and use an exact alarm — see `WorkManagerAutoBackupScheduler`.
work = "2.11.2"
paging = "3.3.6"
# Macrobenchmark: the on-device measurements of #42, and the Baseline Profile generator that
# writes `app/src/main/baselineProfiles/baseline-prof.txt`. Deliberately the runtime only, not
# the `androidx.baselineprofile` Gradle plugin — see `benchmark/build.gradle.kts` for why the
# variants it would create are wired by hand instead.
benchmark = "1.4.1"
# UiAutomator drives the app from outside its process, which is the only way a benchmark can
# touch a release build - there is no Compose test rule on the other side of the APK boundary.
uiautomator = "2.4.0"
# Installs the committed Baseline Profile on first run for the platform versions that do not
# do it themselves. Without it in `:app`, a profile in the APK is dead weight below API 31.
profileinstaller = "1.4.1"
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "4.13.2"
junitExt = "1.3.0"
espresso = "3.6.1"
detekt = "2.0.0-alpha.6"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.14.1"
androidxTestCore = "1.7.0"
jacoco = "0.8.13"
roborazzi = "1.71.0"
sonarqube = "7.4.0.8496"
# Roborazzi's preview-scanning support delegates to this; it is a separate project on its
# own release train, so it carries its own version rather than sharing `roborazzi`.
composablePreviewScanner = "0.9.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# `SavedStateHandle`. Every feature already sees it transitively through navigation, which
# hands one to each `@HiltViewModel`; `:core:ui` names it because the saved-screen-state helper
# there takes one as a receiver, and a transitive it does not declare is not a contract.
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Every artifact below is versioned by the Compose BOM - do not add a version.ref.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Frozen upstream at 1.7.8; the BOM still pins it and it remains the icon set Material 3
# expects. There is no newer release to move to.
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# `WorkManagerTestInitHelper` and `TestListenableWorkerBuilder`, which is how the backup
# worker is driven on the JVM without an emulator — see `BackupWorkerTest`.
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# `@HiltWorker`: `hilt-work` carries the annotation and `HiltWorkerFactory`, and the
# processor below is what generates the factory entry for each worker. Both are versioned
# by `androidxHilt`, not by the Dagger `hilt` version above — they are different artifacts
# from different groups that happen to share a name.
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
# `paging-compose` brings `collectAsLazyPagingItems()` and pulls `paging-runtime` with it. It is
# a feature-module dependency only: `:core:domain` deliberately does not see it, so the records
# list builds its own `PagingSource` over a windowed read rather than over Room's — see
# `PersonalRecordRepository.getRecordsPage` for that decision and what it costs.
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
detekt-formatting = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

# Screenshot testing. `roborazzi-compose` brings `captureRoboImage()` for a `SemanticsNodeInteraction`
# or a composable; `roborazzi-junit-rule` brings `RoborazziRule`. The last two are what the
# generated `@Preview` tests compile against — see `AndroidComposeConventionPlugin`.
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
# The Accessibility Test Framework — the checks Accessibility Scanner runs on a device — driven
# from inside a Robolectric test. `:core:testing` wraps it so every generated `@Preview` test
# runs the same checks as a capture; see docs/ACCESSIBILITY.md.
roborazzi-accessibility-check = { group = "io.github.takahirom.roborazzi", name = "roborazzi-accessibility-check", version.ref = "roborazzi" }
composable-preview-scanner = { group = "io.github.sergio-sastre.ComposablePreviewScanner", name = "android", version.ref = "composablePreviewScanner" }

# Gradle plugin artifacts, resolved as libraries so `build-logic` can compile against
# the plugin APIs it configures. Not for use from a module's `dependencies {}` block —
# apply the matching entry from [plugins] instead.
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
roborazzi-gradle-plugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# `:benchmark` only. A test module has no `main` source set and produces an APK that
# instruments another one - see `AndroidBenchmarkConventionPlugin`.
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }

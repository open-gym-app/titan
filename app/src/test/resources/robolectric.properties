# Robolectric ships no runtime for this module's `targetSdk` and refuses to start when the
# manifest targets a level above the newest one it has, so JVM unit tests run against the
# newest level it does support.
#
# A second copy of `AndroidSdk.ROBOLECTRIC` in build-logic, for the same reason `compileSdk`
# is duplicated in this module's build script: :app applies no convention plugin. Bump both
# together.
sdk=34

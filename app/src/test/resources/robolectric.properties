# Robolectric ships no runtime for this module's `targetSdk` and refuses to start when the
# manifest targets a level above the newest one it has, so JVM unit tests run against the
# newest level it does support.
#
# A second copy of `AndroidSdk.ROBOLECTRIC` in build-logic, for the same reason `compileSdk`
# is duplicated in this module's build script: :app applies no convention plugin. Bump both
# together.
sdk=34

# The window these tests drive the whole app in.
#
# Robolectric's default is 320x470dp, which is a phone from 2010 and two thirds the height of
# anything the app will run on. Home is a dashboard — a resume banner, the week, the quick-start
# actions and a template strip — and at 470dp its actions sit below the fold, so every tap on
# one became a scroll first; the scroll a semantics action performs is animated, and a tap
# injected before it settles lands where the button was a frame ago. Driving the shell at a
# current phone's size is both more honest and not a race.
#
# `:app` keeps no reference images, so nothing here is a reference image's size. The store
# screenshots (`StoreScreenshotTest`) are captured here but set their own window, the 1080x1920
# the Play listing takes.
qualifiers=w411dp-h891dp-xxhdpi
